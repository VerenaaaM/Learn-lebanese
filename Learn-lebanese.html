<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lebanese Arabic flashcards: Session 1</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Noto+Naskh+Arabic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f6;--surface:#ffffff;--ink:#14202b;--muted:#53626f;--line:#c9d5dd;--accent:#1f5fa8;--accent-ink:#ffffff;--good:#1f7a55;--again:#a8402b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a22;--surface:#18262f;--ink:#e8eef2;--muted:#9fb0bc;--line:#2c3e4a;--accent:#6fa8e8;--accent-ink:#0f1a22;--good:#5cc79a;--again:#f08a74;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a22;--surface:#18262f;--ink:#e8eef2;--muted:#9fb0bc;--line:#2c3e4a;--accent:#6fa8e8;--accent-ink:#0f1a22;--good:#5cc79a;--again:#f08a74;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.25rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 18px;font-size:.95rem}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
button{font:inherit;color:inherit;cursor:pointer}
.tab{border:1.5px solid var(--line);background:transparent;padding:8px 14px;border-radius:999px;font-size:.95rem}
.tab[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.opts{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.9rem;margin-bottom:14px;gap:8px;flex-wrap:wrap}
.link{background:none;border:none;color:var(--accent);padding:4px 0;text-decoration:underline;font-size:.9rem}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;background:var(--good);width:0;transition:width .25s}
.count{color:var(--muted);font-size:.85rem;margin-bottom:14px}
.card{width:100%;min-height:280px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
.card:focus-visible,.tab:focus-visible,.link:focus-visible,.act:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ar{font-family:"Noto Naskh Arabic","Geeza Pro","Segoe UI",serif;font-size:3.4rem;line-height:1.5;direction:rtl;font-weight:500}
.ar.long{font-size:2.4rem}
.en{font-size:1.7rem;font-weight:700}
.tr{font-size:1.15rem;color:var(--accent);font-weight:700}
.note{font-size:.9rem;color:var(--muted);max-width:36ch}
.hint{color:var(--muted);font-size:.85rem}
.row{display:flex;gap:10px;margin-top:14px}
.act{flex:1;padding:14px;border-radius:10px;border:1.5px solid;font-weight:700;font-size:1rem;background:transparent}
.act.again{color:var(--again);border-color:var(--again)}
.act.good{color:var(--good);border-color:var(--good)}
.act:disabled{opacity:.35;cursor:default}
.done{text-align:center;padding:40px 16px}
.done h2{margin:0 0 8px}
.big{background:var(--accent);color:var(--accent-ink);border:none;border-radius:10px;padding:12px 20px;font-weight:700;margin-top:10px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<main>
<h1>Lebanese Arabic: Session 1</h1>
<p class="sub">Tap the card (or press Space) to flip it. Mark each card as you go.</p>
<div class="tabs" id="tabs" role="group" aria-label="Choose a deck"></div>
<div class="opts">
  <button class="link" id="dir" type="button"></button>
  <button class="link" id="shuf" type="button">Shuffle</button>
</div>
<div class="bar"><i id="fill"></i></div>
<div class="count" id="count"></div>
<div id="stage"></div>
</main>
<script>
var DECKS=[
{n:"First 6",c:[
{a:"بِنْت",t:"bint",e:"girl / daughter"},
{a:"بَيْت",t:"beit",e:"house",x:"The book writes bayt. Lebanese say beit."},
{a:"تِين",t:"tiin",e:"figs"},
{a:"بُنّ",t:"bunn",e:"coffee beans",x:"Double n: hold the sound a little."},
{a:"مرحبا",t:"marHaba",e:"hello",x:"Reply: مرحبتين (marHabtayn)"},
{a:"مع السلامة",t:"ma3 is-salaame",e:"goodbye"}
]},
{n:"Greetings",c:[
{a:"مرحبا",t:"marHaba",e:"hello"},
{a:"مرحبتين",t:"marHabtayn",e:"hello (reply)"},
{a:"أهلا",t:"ahlan",e:"hi"},
{a:"أهلين",t:"ahleen",e:"hi (reply)"},
{a:"هلا",t:"hala",e:"hi (casual)"},
{a:"صباح الخير",t:"sabaaH il-khayr",e:"good morning"},
{a:"صباح النور",t:"sabaaH in-nuur",e:"good morning (reply)"},
{a:"مسا الخير",t:"masa l-khayr",e:"good evening"},
{a:"مسا النور",t:"masa n-nuur",e:"good evening (reply)"},
{a:"كيفِك؟",t:"kiifik?",e:"how are you? (to a woman)"},
{a:"كيفَك؟",t:"kiifak?",e:"how are you? (to a man)"},
{a:"منيحة",t:"mniiHa",e:"I’m good (a woman says this)"},
{a:"منيح",t:"mniiH",e:"I’m good (a man says this)"},
{a:"الحمدلله",t:"il-Hamdillah",e:"thank God"},
{a:"وإنتِ؟",t:"w inti?",e:"and you? (to a woman)"},
{a:"وإنتَ؟",t:"w inte?",e:"and you? (to a man)"},
{a:"مرسي",t:"mersi",e:"thank you"},
{a:"مع السلامة",t:"ma3 is-salaame",e:"goodbye"},
{a:"باي",t:"bye",e:"bye"},
{a:"السلام عليكم",t:"as-salaamu 3alaykum",e:"peace be upon you",x:"Reply: وعليكم السلام (wa 3alaykum is-salaam)"}
]},
{n:"Letters",c:[
{a:"ب",t:"baa’",e:"b, one dot below"},
{a:"ت",t:"taa’",e:"t, two dots above"},
{a:"ث",t:"thaa’",e:"th, three dots above",x:"Many Lebanese say t or s in speech."},
{a:"ن",t:"nuun",e:"n, one dot above"},
{a:"ي",t:"yaa’",e:"y, two dots below"}
]}
];
var di=0,front="ar",queue=[],total=0,done=0,flipped=false;
var $=function(i){return document.getElementById(i)};
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function start(){queue=shuffle(DECKS[di].c.slice());total=queue.length;done=0;flipped=false;render()}
function tabs(){var t=$("tabs");t.innerHTML="";DECKS.forEach(function(d,i){var b=document.createElement("button");b.className="tab";b.type="button";b.textContent=d.n+" ("+d.c.length+")";b.setAttribute("aria-pressed",i===di);b.onclick=function(){di=i;tabs();start()};t.appendChild(b)})}
function arEl(s){var d=document.createElement("div");d.className="ar"+(s.length>8?" long":"");d.lang="ar";d.textContent=s;return d}
function el(c,s){var d=document.createElement("div");d.className=c;d.textContent=s;return d}
function render(){
 $("dir").textContent=front==="ar"?"Showing Arabic first. Switch to English first":"Showing English first. Switch to Arabic first";
 $("fill").style.width=(total?done/total*100:0)+"%";
 var st=$("stage");st.innerHTML="";
 if(!queue.length){$("count").textContent=done+" of "+total+" done";
  var d=el("done","");d.innerHTML="<h2>Deck finished</h2><p class='sub'>All "+total+" cards done. Try the other direction or another deck.</p>";
  var b=document.createElement("button");b.className="big";b.type="button";b.textContent="Practice this deck again";b.onclick=start;d.appendChild(b);st.appendChild(d);return}
 $("count").textContent=done+" of "+total+" done, "+queue.length+" left";
 var c=queue[0],card=document.createElement("button");card.className="card";card.type="button";
 card.setAttribute("aria-label",flipped?"Card back. Press to flip.":"Card front. Press to flip.");
 if(!flipped){
  if(front==="ar")card.appendChild(arEl(c.a));else card.appendChild(el("en",c.e));
  card.appendChild(el("hint","Tap to flip"));
 }else{
  if(front==="ar"){card.appendChild(el("en",c.e));card.appendChild(el("tr",c.t))}
  else{card.appendChild(arEl(c.a));card.appendChild(el("tr",c.t))}
  if(c.x)card.appendChild(el("note",c.x));
 }
 card.onclick=function(){flipped=!flipped;render();var n=document.querySelector(".card");if(n)n.focus()};
 st.appendChild(card);
 var r=document.createElement("div");r.className="row";
 var ag=document.createElement("button"),gd=document.createElement("button");
 ag.className="act again";ag.type="button";ag.textContent="Again";gd.className="act good";gd.type="button";gd.textContent="Got it";
 ag.disabled=gd.disabled=!flipped;
 ag.onclick=function(){var k=queue.shift();queue.push(k);flipped=false;render()};
 gd.onclick=function(){queue.shift();done++;flipped=false;render()};
 r.appendChild(ag);r.appendChild(gd);st.appendChild(r);
}
$("dir").onclick=function(){front=front==="ar"?"en":"ar";flipped=false;render()};
$("shuf").onclick=start;
document.addEventListener("keydown",function(e){if(e.code==="Space"&&queue.length&&document.activeElement.tagName!=="BUTTON"){e.preventDefault();flipped=!flipped;render()}});
tabs();start();
</script>
</body>
</html>
